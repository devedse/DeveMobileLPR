# Purpose: build, test, package, and publish DeveMobileLPR on normal CI/release runs.
name: GitHubActionsBuilds

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate_version_number:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{ secrets.github_token }}

  generate_litert_model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download and verify source model
        shell: pwsh
        run: ./eng/Download-Models.ps1

      - name: Generate and verify LiteRT models
        shell: pwsh
        run: ./eng/Generate-LiteRt-Models.ps1

      - name: Upload generated LiteRT models
        uses: actions/upload-artifact@v7
        with:
          name: litert-models-${{ github.sha }}
          path: |
            artifacts/models/yolo-v9-s-608-license-plates-raw.onnx
            artifacts/models/yolo-v9-s-608-license-plates-raw_float32.tflite
            artifacts/models/cct_s_v2_global_float32.tflite
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [generate_version_number, generate_litert_model]
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      release_signed: ${{ steps.signing.outputs.configured }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DEVEMOBILELPR_MODEL_DIR: ${{ github.workspace }}\artifacts\models
      BUILD_NUMBER: ${{ needs.generate_version_number.outputs.build_number }}
      BUILD_VERSION: 1.0.${{ needs.generate_version_number.outputs.build_number }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/DeveMobileLPR.App/MapWeb/package-lock.json

      - name: Restore and verify map web assets
        working-directory: src/DeveMobileLPR.App/MapWeb
        run: |
          npm ci --ignore-scripts
          npm run verify

      - name: Restore workloads
        shell: pwsh
        run: dotnet workload install maui-android maui-windows --skip-manifest-update

      - name: Download and verify model assets
        shell: pwsh
        run: ./eng/Download-Models.ps1

      - name: Download generated LiteRT models
        uses: actions/download-artifact@v8
        with:
          name: litert-models-${{ github.sha }}
          path: artifacts/models

      - name: Verify generated LiteRT models
        shell: pwsh
        run: ./eng/Generate-LiteRt-Models.ps1

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore DeveMobileLPR.slnx --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build DeveMobileLPR.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=$env:BUILD_VERSION -p:ApplicationVersion=$env:BUILD_NUMBER -p:ApplicationDisplayVersion=$env:BUILD_VERSION

      - name: Test
        shell: pwsh
        run: dotnet test DeveMobileLPR.slnx --configuration Release --no-build --filter "Category!=Model" --collect "XPlat Code Coverage" --results-directory artifacts/test-results

      - name: Verify ONNX model contracts
        shell: pwsh
        run: dotnet test tests/DeveMobileLPR.Inference.Tests/DeveMobileLPR.Inference.Tests.csproj --configuration Release --no-build --filter "Category=Model"

      - name: Package portable RDW downloader
        shell: pwsh
        run: ./eng/Publish-RdwDownloader.ps1 -Configuration Release -Version $env:BUILD_VERSION

      - name: Package Windows executable
        shell: pwsh
        run: ./eng/Publish-Windows.ps1 -Configuration Release -Version $env:BUILD_VERSION

      - name: Detect signing configuration
        id: signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64) `
            -and -not [string]::IsNullOrWhiteSpace($env:KEYSTORE_PASSWORD) `
            -and -not [string]::IsNullOrWhiteSpace($env:KEY_ALIAS) `
            -and -not [string]::IsNullOrWhiteSpace($env:KEY_PASSWORD)
          "configured=$($configured.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if ($configured) {
            [System.IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'release.keystore'), [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          }

      - name: Package debug-signed Android APK
        if: steps.signing.outputs.configured != 'true'
        shell: pwsh
        run: ./eng/Publish-Android.ps1 -Configuration Release -Version $env:BUILD_VERSION -ApplicationVersion $env:BUILD_NUMBER -ApplicationDisplayVersion $env:BUILD_VERSION

      - name: Package release-signed Android APK
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./eng/Publish-Android.ps1 -Configuration Release -Version $env:BUILD_VERSION -ApplicationVersion $env:BUILD_NUMBER -ApplicationDisplayVersion $env:BUILD_VERSION -Keystore "$env:RUNNER_TEMP\release.keystore" -KeystorePassword $env:KEYSTORE_PASSWORD -KeyAlias $env:KEY_ALIAS -KeyPassword $env:KEY_PASSWORD

      - name: Upload Android APK on every build
        uses: actions/upload-artifact@v7
        with:
          name: DeveMobileLPR-Android-${{ env.BUILD_VERSION }}
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows executable on every build
        uses: actions/upload-artifact@v7
        with:
          name: DeveMobileLPR-Windows-${{ env.BUILD_VERSION }}
          path: artifacts/windows/win-x64/DeveMobileLPR.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload RDW downloader on every build
        uses: actions/upload-artifact@v7
        with:
          name: RdwDownloader-${{ env.BUILD_VERSION }}
          path: artifacts/rdw-downloader/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ env.BUILD_VERSION }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: [generate_version_number, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.outputs.release_signed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: DeveMobileLPR-Android-1.0.${{ needs.generate_version_number.outputs.build_number }}
          path: artifacts/android

      - name: Download RDW downloader
        uses: actions/download-artifact@v8
        with:
          name: RdwDownloader-1.0.${{ needs.generate_version_number.outputs.build_number }}
          path: artifacts/rdw-downloader

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: DeveMobileLPR-Windows-1.0.${{ needs.generate_version_number.outputs.build_number }}
          path: artifacts/windows/win-x64

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 1.0.${{ needs.generate_version_number.outputs.build_number }}
          name: 1.0.${{ needs.generate_version_number.outputs.build_number }}
          body: |
            ${{ github.event.head_commit.message }}
          files: |
            artifacts/android/*.apk
            artifacts/windows/win-x64/DeveMobileLPR.exe
            artifacts/rdw-downloader/*.zip
          fail_on_unmatched_files: true
          make_latest: true
